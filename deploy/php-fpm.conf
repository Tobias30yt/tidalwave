; /etc/php/8.3/fpm/pool.d/tidalwave.conf
[tidalwave]
user = tidalwave
group = tidalwave
listen = /run/php/tidalwave.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A small on-demand pool leaves resources for the Discord bot.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 20
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 27M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/tidalwave/storage/logs/php-error.log
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[zend.exception_ignore_args] = on
