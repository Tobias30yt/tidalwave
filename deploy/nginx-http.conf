# /etc/nginx/conf.d/tidalwave-http.conf — loaded inside the main http{} context.
# $uri excludes query parameters. Do not add $request, $args, Referer or body here.
log_format tidalwave_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent $request_time';
