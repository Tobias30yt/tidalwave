# /etc/nginx/sites-available/tidalwave
# Replace example.invalid with your real domain before enabling.
# This HTTP bootstrap configuration MUST be secured with TLS before launch.
server {
    listen 80;
    listen [::]:80;
    server_name example.invalid;
    root /var/www/tidalwave/public;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    # Define tidalwave_private in the http{} context; see deploy/nginx-http.conf.
    # Do not log OAuth callback query strings, codes, or verification bodies.
    access_log /var/log/nginx/tidalwave-access.log tidalwave_private;
    error_log /var/log/nginx/tidalwave-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # These cover static responses. PHP sends the same headers for HTML.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ /\. { return 404; }
    location ~* \.(?:md|json|ini|log|sql|sqlite|sqlite-wal|sqlite-shm|env|bak|sh|yml|yaml|toml)$ { return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }
    location ~* ^/(?:assets/.*\.(?:css|js|svg|png|jpe?g|webp|avif|woff2)|favicon\.svg)$ {
        try_files $uri =404;
        # Revalidate daily. CSS/JS also carry a configurable version query.
        expires 1d;
    }
    location = /admin/save {
        client_max_body_size 27m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/tidalwave.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
    location = /admin/projects/save {
        client_max_body_size 52m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/tidalwave.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/tidalwave.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
    # Only the front controller is executable; never expose other PHP source.
    location ~ \.php(?:/|$) { return 404; }
}
