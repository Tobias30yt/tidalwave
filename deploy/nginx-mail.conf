# Include inside the existing HTTPS server{} block, before generic locations.
# Webmail talks to the private Stalwart JMAP endpoint through PHP. No public admin proxy.
location = /mail/compose {
    client_max_body_size 27m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_pass unix:/run/php/tidalwave.sock;
    fastcgi_read_timeout 60s;
    fastcgi_hide_header X-Powered-By;
}
